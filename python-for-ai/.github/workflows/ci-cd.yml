name: Bookstore API CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx requests  # For testing

    - name: Run tests
      run: |
        python test_bookstore.py

    - name: Run API tests with pytest (if available)
      run: |
        # Start the server in background
        python bookstore_api.py &
        SERVER_PID=$!

        # Wait for server to start
        sleep 5

        # Run tests
        python -m pytest test_bookstore.py -v || python test_bookstore.py

        # Kill server
        kill $SERVER_PID || true
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy

    - name: Run flake8
      run: |
        flake8 bookstore_api.py test_bookstore.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 bookstore_api.py test_bookstore.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with black
      run: |
        black --check --diff bookstore_api.py test_bookstore.py

    - name: Check import sorting with isort
      run: |
        isort --check-only --diff bookstore_api.py test_bookstore.py

    - name: Run mypy type checking
      run: |
        mypy bookstore_api.py test_bookstore.py --ignore-missing-imports
      continue-on-error: true

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit security linter
      run: |
        bandit -r bookstore_api.py test_bookstore.py -f json -o bandit-report.json || true
        bandit -r bookstore_api.py test_bookstore.py

    - name: Check for vulnerable dependencies
      run: |
        safety check --file requirements.txt --output json || true

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: bookstore-api:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run --rm -d --name test-api -p 8000:8000 bookstore-api:latest
        sleep 10
        curl -f http://localhost:8000/ || exit 1
        docker stop test-api

  deploy:
    runs-on: ubuntu-latest
    needs: [test, lint, security, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production..."
        # Add your deployment commands here
        # Examples:
        # - Deploy to Heroku: heroku container:push web && heroku container:release web
        # - Deploy to AWS ECR: aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin <account>.dkr.ecr.us-east-1.amazonaws.com
        # - Deploy to Google Cloud Run: gcloud run deploy bookstore-api --source . --region us-central1 --allow-unauthenticated
        echo "✅ Deployment completed!"

  notify:
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: always()

    steps:
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Pipeline failed! Check the logs above for details."

    - name: Notify on success
      if: success()
      run: |
        echo "✅ All checks passed! Ready for deployment."
